# Test overrides. Spring loads config/application.properties on top of the main
# application.properties, so only test-specific settings belong here.
# The datasource comes from the Testcontainers Postgres in TestcontainersConfiguration.

# Tests drive the fight engine by calling tick(); no schedule and no tick at startup.
game.engine.cron=-

# The app refuses to load the dev roster outside the dev profile, so tests load their own copy of it.
game.roster-file=classpath:roster-test.json
