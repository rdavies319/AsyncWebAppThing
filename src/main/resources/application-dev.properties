# The dev profile: the dev controls, and a fast cadence so a fight is checkable in a few minutes.
# A fight every 3 minutes, 5-second exchanges (30 × 5s = 2.5 minutes, so a capped fight settles
# before the next slot) and an engine tick every second. Environment variables still override these.
game.fight-cron=0 */3 * * * *
game.exchange-interval=5s
game.engine.cron=* * * * * *
