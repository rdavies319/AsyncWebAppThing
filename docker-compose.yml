services:
  db:
    image: postgres:15-alpine
    container_name: arena-db
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d arena"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: arena-app
    ports:
      - "8080:8080"
    # game.* overrides as environment variables (.env.example lists them). ENV_FILE=.env.dev runs the
    # arena locally. Plain `docker compose up` loads .env if there is one, and on a fresh database the
    # app refuses to start on the dev roster. This file mounts no real roster, so that's the expected end.
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/arena
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
