services:
  db:
    image: postgres:15-alpine
    container_name: higher-lower-db
    environment:
      POSTGRES_DB: higher_lower
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d higher_lower"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: higher-lower-api
    ports:
      - "8080:8080"
    # game.* overrides as environment variables (.env.example lists them). Plain `docker compose up`
    # loads .env if there is one, else runs on the production defaults; ENV_FILE=.env.dev runs dev.
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/higher_lower
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
