spring.application.name=api

# H2 in PostgreSQL mode so the real Flyway migrations run in tests without a database server.
spring.datasource.url=jdbc:h2:mem:game;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
# Generate SQL as for production Postgres (lower-case quoted identifiers) rather than H2's upper case.
spring.data.jdbc.dialect=postgresql
spring.datasource.username=sa
spring.datasource.password=

# Tests drive the engine by calling tick() directly.
game.engine.cron=-
