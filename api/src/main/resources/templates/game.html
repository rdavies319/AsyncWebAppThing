<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Higher or Lower</title>
    <!-- htmx requests carry these as a header (see the script below); plain forms get a hidden field from th:action -->
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
            integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"
            integrity="sha384-fw+eTlCc7suMV/1w/7fr2/PmwElUIt5i82bi+qTiLXvjRXZ2/FkiTNA/w0MhXnGI"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/app.css}">
    <style>
        .card { text-align: center; }
        .roll-display { font-size: 4rem; font-weight: bold; color: #1a73e8; margin: 1rem 0 0.25rem; }
        .timer { font-size: 1.1rem; color: #666; margin-bottom: 1.5rem; min-height: 1.4em; }
        .stake { margin-bottom: 1rem; }
        .stake-input { width: 80px; padding: 0.5rem; text-align: center; }
        .controls { display: flex; gap: 0.75rem; }
        .side { flex: 1; padding: 0.75rem 0.5rem; border: none; border-radius: 0.5rem; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; }
        .side small { display: block; font-weight: normal; opacity: 0.85; margin-top: 0.2rem; }
        .side:disabled { background: #9bb8e8; cursor: not-allowed; }
        .last-result { background: #f5f7fa; border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 1rem; font-size: 0.9rem; color: #444; }
        .last-result .outcome { font-weight: bold; margin-top: 0.25rem; }
        .my-bet { padding: 0.75rem; border: 1px dashed #1a73e8; border-radius: 0.5rem; color: #1a73e8; }
        .wallet { margin-top: 1.5rem; font-size: 0.9rem; color: #888; }
        .account { font-size: 0.85rem; color: #666; margin-top: -0.5rem; }
        .link { background: none; border: none; padding: 0; color: #1a73e8; cursor: pointer; font: inherit; text-decoration: underline; }
        .login-prompt { color: #444; }
        .topup { display: block; margin: 0.5rem auto 0; padding: 0.4rem 0.8rem; border: 1px solid #1a73e8; border-radius: 0.5rem; background: white; color: #1a73e8; cursor: pointer; }
        .commit { margin-top: 1rem; font-size: 0.7rem; color: #888; word-break: break-all; }
    </style>
</head>
<body>

<!-- One SSE connection for the page. Every connect starts with a round_open snapshot, and each
     round_open comes after the settlement commit, so refetching the board then shows the new roll,
     the last result and the balance together. -->
<main class="card" hx-ext="sse" sse-connect="/live">
    <h2>Higher or Lower</h2>
    <form class="account" th:if="${player}" method="post" th:action="@{/auth/logout}">
        <span th:text="${player.displayName()}">player</span> · <button type="submit" class="link">Log out</button>
    </form>

    <div id="board" th:fragment="board"
         hx-get="/fragments/board" hx-trigger="sse:round_open" hx-swap="outerHTML"
         th:attr="data-server-now=${view?.serverTime()?.toEpochMilli()},data-deadline=${view?.cutoffAt()?.toEpochMilli()},data-roll-at=${view?.rollAt()?.toEpochMilli()}">

        <div class="last-result" th:if="${lastRound}">
            <div>
                Last roll: <span th:text="${lastRound.round().rollValue()}">0</span>
                &rarr; <strong th:text="${lastRound.nextRoll()}">0</strong>
            </div>
            <div class="outcome" th:if="${lastResult?.outcome()}" th:text="${lastResult.outcome()}"></div>
        </div>

        <div th:if="${view}">
            <div class="roll-display" th:text="${view.roll()}">0</div>
            <div class="timer" id="timer">&nbsp;</div>

            <div class="my-bet" th:if="${myPrediction}">
                Your bet: <strong th:text="${myPrediction.stake()}">0</strong> pts on
                <strong th:text="${myPrediction.direction()}">HIGHER</strong>
                at <span th:text="${myPrediction.multiplier()}">1.96x</span>
            </div>

            <form id="predictForm" th:if="${player != null and myPrediction == null}"
                  hx-post="/predict" hx-target="#board" hx-swap="outerHTML">
                <input type="hidden" name="roundId" th:value="${view.roundId()}">
                <div class="stake">
                    Stake: <input type="number" name="stake" class="stake-input" required
                                  th:value="${stake} ?: ${minStake}" th:min="${minStake}"> pts
                </div>
                <div class="controls">
                    <button type="submit" name="prediction" value="HIGHER" class="side"
                            th:disabled="${view.higher() == null}">
                        Higher
                        <small th:if="${view.higher()}"
                               th:text="${view.higher().multiplier()} + ' · max ' + ${view.higher().maxStake()}">1.96x</small>
                    </button>
                    <button type="submit" name="prediction" value="LOWER" class="side"
                            th:disabled="${view.lower() == null}">
                        Lower
                        <small th:if="${view.lower()}"
                               th:text="${view.lower().multiplier()} + ' · max ' + ${view.lower().maxStake()}">2.00x</small>
                    </button>
                </div>
                <p class="error" th:if="${error}" th:text="${error}" role="alert"></p>
            </form>

            <p class="commit" th:if="${view.nextSeedCommitHash()}">
                Next roll's seed commit (SHA-256): <code th:text="${view.nextSeedCommitHash()}"></code>
            </p>
        </div>

        <div th:unless="${view}">
            <p>Waiting for the next round...</p>
        </div>

        <p class="login-prompt" th:unless="${player}">
            <a th:href="@{/auth/login}">Log in</a> or <a th:href="@{/auth/signup}">sign up</a> to play.
        </p>

        <div class="wallet" th:if="${player}">
            Balance: <span th:text="${wallet.balance}">0</span> pts
            <button class="topup" th:if="${canTopUp}" hx-post="/topup" hx-target="#board" hx-swap="outerHTML"
                    th:text="'Daily top-up to ' + ${topUpTarget}">Daily top-up</button>
            <p class="error" th:if="${topUpError}" th:text="${topUpError}" role="alert"></p>
        </div>
    </div>
</main>

<script>
    // CSRF protection is on, so every htmx POST sends the token as a header
    document.body.addEventListener('htmx:configRequest', (e) => {
        const header = document.querySelector('meta[name="csrf-header"]').content;
        e.detail.headers[header] = document.querySelector('meta[name="csrf-token"]').content;
    });

    // The server clock is the authority: track how far the browser's clock is from it, refreshed
    // whenever a new board arrives (each one carries the server time it was rendered at).
    let clockOffset = 0;
    function syncClock() {
        const board = document.getElementById('board');
        if (board && board.dataset.serverNow) clockOffset = Number(board.dataset.serverNow) - Date.now();
    }
    document.body.addEventListener('htmx:afterSwap', syncClock);
    syncClock();

    function updateTimer() {
        const board = document.getElementById('board');
        const timer = document.getElementById('timer');
        if (!board || !timer || !board.dataset.deadline) return;
        const now = Date.now() + clockOffset;
        const deadline = Number(board.dataset.deadline);
        const rollAt = Number(board.dataset.rollAt);
        if (now < deadline) {
            timer.innerText = `Predictions close in ${Math.ceil((deadline - now) / 1000)}s`;
            return;
        }
        timer.innerText = now < rollAt ? `Closed. Rolling in ${Math.ceil((rollAt - now) / 1000)}s` : 'Rolling...';
        document.querySelectorAll('#predictForm button').forEach(b => b.disabled = true);
    }
    setInterval(updateTimer, 250);
    updateTimer();
</script>

</body>
</html>
